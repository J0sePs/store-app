# Configuración de nginx del frontend: sirve la SPA y hace de proxy hacia los servicios.
# El prefijo /api se quita y se conserva el recurso: /api/products/1 -> products-service:8000/products/1
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;

    # --- health del propio frontend: probe de Kubernetes, no depende de ningún servicio ---
    location = /health {
        rewrite ^ /health.json break;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- health de cada servicio (van antes que los prefijos) ---
    location = /api/products/health {
        proxy_pass http://products-service:8000/health;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location = /api/orders/health {
        proxy_pass http://orders-service:8080/health;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # --- products-service ---
    location = /api/products {
        proxy_pass http://products-service:8000/products;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /api/products/ {
        proxy_pass http://products-service:8000/products/;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # --- orders-service ---
    location = /api/orders {
        proxy_pass http://orders-service:8080/orders;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /api/orders/ {
        proxy_pass http://orders-service:8080/orders/;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # Cualquier otra ruta /api/ no existe (no debe devolver index.html)
    location /api/ {
        default_type application/json;
        return 404 '{"error": "Ruta no encontrada"}';
    }

    # --- caché ---
    location = /version.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Los archivos con hash en el nombre se pueden cachear mucho tiempo
    location ~* \.(?:js|css|ico|png|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --- SPA: cualquier otra ruta devuelve index.html ---
    location / {
        try_files $uri /index.html;
    }
}
