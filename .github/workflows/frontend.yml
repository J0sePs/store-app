# CI del frontend: pruebas -> imagen en ECR (tag = SHA corto) -> actualización de store-gitops.
# Se dispara con un push a main que cambie frontend/ (o a mano con workflow_dispatch).
name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read

# Dos pushes seguidos al mismo componente se procesan en orden (sin cancelar el que está corriendo)
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  test:
    name: Test frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --watch=false

  deploy:
    name: Deploy frontend
    needs: test
    # id-token: write lo necesita el workflow reutilizable para asumir el rol de AWS por OIDC
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-component.yml
    with:
      component: frontend
      aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
      aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      # El frontend recibe el SHA corto como APP_VERSION al construir la imagen
      pass-app-version: true
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
