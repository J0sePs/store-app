# Workflow reutilizable: publica la imagen de un componente en ECR y actualiza store-gitops.
# No se lanza solo: lo llaman frontend.yml, products-service.yml y orders-service.yml (job "deploy").
# El código sensible (OIDC, push a ECR, token de gitops) vive aquí, una sola vez.
name: Deploy component

on:
  workflow_call:
    inputs:
      component:
        description: "Componente: frontend, products-service u orders-service (carpeta, repositorio ECR y app de gitops)"
        required: true
        type: string
      aws-role-arn:
        description: "ARN del rol IAM que se asume por OIDC (variable AWS_ROLE_ARN)"
        required: true
        type: string
      aws-region:
        description: "Región de AWS de ECR"
        required: false
        type: string
        default: us-east-1
      pass-app-version:
        description: "Pasar el SHA corto como build-arg APP_VERSION (lo usa el frontend)"
        required: false
        type: boolean
        default: false
    secrets:
      GITOPS_TOKEN:
        description: "Token con permiso de escritura de contenido solo sobre store-gitops"
        required: false

permissions:
  contents: read

env:
  # Kustomize fijado y verificado con su suma sha256 (kubernetes-sigs/kustomize, linux/amd64)
  KUSTOMIZE_VERSION: "5.8.3"
  KUSTOMIZE_SHA256: "cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61"

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token: write permite pedir el token OIDC con el que se asume el rol de AWS
    permissions:
      contents: read
      id-token: write
    outputs:
      short-sha: ${{ steps.vars.outputs.short-sha }}
      registry: ${{ steps.ecr-login.outputs.registry }}
    steps:
      - name: Check required configuration
        env:
          AWS_ROLE_ARN: ${{ inputs.aws-role-arn }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Falta la variable AWS_ROLE_ARN (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi
          echo "Configuración de AWS presente"

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compute short SHA
        id: vars
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "short-sha=${COMMIT_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "SHA corto de la imagen: ${COMMIT_SHA::7}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # La única etiqueta que se publica es el SHA corto (nunca "latest")
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ inputs.component }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ inputs.component }}:${{ steps.vars.outputs.short-sha }}
          build-args: ${{ inputs.pass-app-version && format('APP_VERSION={0}', steps.vars.outputs.short-sha) || '' }}
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}

      - name: Verify image in ECR
        env:
          COMPONENT: ${{ inputs.component }}
          SHORT_SHA: ${{ steps.vars.outputs.short-sha }}
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          if ! aws ecr describe-images --repository-name "$COMPONENT" --image-ids "imageTag=$SHORT_SHA" --query 'imageDetails[0].imageTags' --output text; then
            echo "::error::La imagen $COMPONENT:$SHORT_SHA no aparece en ECR; no se actualiza store-gitops"
            exit 1
          fi
          echo "Imagen publicada y verificada: $REGISTRY/$COMPONENT:$SHORT_SHA"
          {
            echo "### Imagen publicada"
            echo ""
            echo "- Componente: \`$COMPONENT\`"
            echo "- Imagen: \`$REGISTRY/$COMPONENT:$SHORT_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Solo corre si build-and-push terminó bien (needs): si falla el build, el push o la verificación, gitops no se toca
  update-gitops:
    name: Update store-gitops
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # Un solo escritor a la vez en store-gitops (sin cancelar los que esperan)
    concurrency:
      group: gitops-update
      cancel-in-progress: false
    steps:
      - name: Check required configuration
        env:
          HAS_GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN != '' }}
        run: |
          if [ "$HAS_GITOPS_TOKEN" != "true" ]; then
            echo "::error::Falta el secret GITOPS_TOKEN (Settings > Secrets and variables > Actions > Secrets)"
            exit 1
          fi
          echo "Configuración de gitops presente"

      - name: Checkout CI scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Checkout store-gitops
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/store-gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Install Kustomize
        run: |
          base="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}"
          curl -fsSL -o kustomize.tar.gz "${base}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf kustomize.tar.gz -C "$RUNNER_TEMP/bin" kustomize
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/kustomize" version

      - name: Update image in store-gitops
        env:
          COMPONENT: ${{ inputs.component }}
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.registry }}
          SHORT_SHA: ${{ needs.build-and-push.outputs.short-sha }}
          GITOPS_DIR: ${{ github.workspace }}/gitops
        run: bash .github/scripts/update-gitops.sh
