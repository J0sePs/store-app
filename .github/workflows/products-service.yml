# CI de products-service: pruebas -> imagen en ECR (tag = SHA corto) -> actualización de store-gitops.
# Se dispara con un push a main que cambie products-service/ (o a mano con workflow_dispatch).
name: Products service

on:
  push:
    branches: [main]
    paths:
      - "products-service/**"
  workflow_dispatch:

permissions:
  contents: read

# Dos pushes seguidos al mismo componente se procesan en orden (sin cancelar el que está corriendo)
concurrency:
  group: deploy-products-service
  cancel-in-progress: false

jobs:
  test:
    name: Test products-service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: products-service
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: products-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run unit tests
        run: pytest

  deploy:
    name: Deploy products-service
    needs: test
    # id-token: write lo necesita el workflow reutilizable para asumir el rol de AWS por OIDC
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-component.yml
    with:
      component: products-service
      aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
      aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
